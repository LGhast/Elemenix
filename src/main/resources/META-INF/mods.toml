modLoader = "javafml"
loaderVersion = "${loader_version_range}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = "${mod_description}"
authors = "${mod_authors}"
license = "${mod_license}"

[[dependencies.${mod_id}]]
modId = "neoforge"
mandatory = true
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ftbquests"
mandatory = false
versionRange = "[2101,)"
ordering = "AFTER"
side = "BOTH"